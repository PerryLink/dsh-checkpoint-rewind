verifyDepsBeforeRun: false

# The plugin's own Config schema must be built by a schemastery that materializes
# Volatile references (3.18.3+; the 0.1.7-alpha.2 host declares ~3.18.4), or the
# Settings form's live in-place editing silently degrades to plain values. The
# nominal `^3.18.2` devDep range admits it, but the lockfile kept resolving the
# older 3.18.2 patch and the host peers then pulled their own copies — this
# floor keeps exactly one copy of the schema library for schema and form.
overrides:
  '@deepseek-ai/schemastery': 3.18.4
