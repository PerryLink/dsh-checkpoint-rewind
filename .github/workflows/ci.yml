name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type gate
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Lint
        run: npm run lint

      - name: README sync (five languages)
        run: npm run check:readmes

      - name: Verify self-contained dependency specs
        run: npm run verify:self-contained

      - name: Verify shipped artifacts
        run: npm run verify:artifacts

      - name: Assembled-headless integration
        run: npm run test:integration
